name: Actualizar cotizacion
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python guardar_dolar.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dolar.db
          git commit -m "Actualizacion automatica" || echo "Sin cambios"
          git push
